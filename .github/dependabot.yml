version: 2
updates:
  # nuget packages in the solution
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # the app targets .NET 10 (LTS), so the runtime packages follow that major.
    # an 11.x of these pulls the next runtime's libraries into a net10 build.
    # naudio majors change the resampler api used by the recorder, done by hand
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "NAudio*"
        update-types: ["version-update:semver-major"]
    # one PR for all nuget bumps instead of one per package
    groups:
      nuget:
        patterns:
          - "*"
  # github actions used in the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # one PR for all action bumps
    groups:
      actions:
        patterns:
          - "*"
