name: Release

# Dispara quando uma tag vX.Y.Z e enviada (ex.: git tag v1.0.0 && git push origin v1.0.0)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necessario para criar a Release e anexar os arquivos

# versoes fixas das ferramentas: o tools/check-release.ps1 confere que a maquina
# local usa exatamente as mesmas antes de qualquer tag
env:
  INNO_VERSION: "6.7.3"
  INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.403"

      - name: Derivar versao da tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versao: $version"

      # instalador oficial do jrsoftware na versao fixa, com o hash conferido
      # (o pacote do chocolatey anda atrasado e nao tem a mesma versao da maquina local)
      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          $tag = "is-" + $env:INNO_VERSION.Replace(".", "_")
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw "hash do Inno Setup nao confere" }
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait

      # o mesmo script que roda na maquina local antes da tag: confere versao da tag
      # contra csproj e iss, actionlint, build, testes, instalador e portable em dist
      - name: Checar, compilar e empacotar
        shell: pwsh
        run: ./tools/check-release.ps1 -Version ${{ steps.version.outputs.version }} -SkipGitHub

      - name: Criar Release e anexar artefatos
        uses: softprops/action-gh-release@v3
        with:
          name: Klip ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Klip-Setup-${{ steps.version.outputs.version }}.exe
            dist/Klip-${{ steps.version.outputs.version }}-portable.exe

      # Atualiza o manifesto no winget-pkgs a cada release.
      # Requer o secret WINGET_TOKEN (um PAT classico com escopo public_repo)
      # e que o pacote PoBruno.Klip ja exista no winget (primeiro envio e manual;
      # feito na 1.3.0 via wingetcreate submit - PR microsoft/winget-pkgs#401529).
      # Nota: o manifesto publicado tem SO o instalador Inno (o portable nao entra),
      # entao o update passa apenas a URL do Setup. Id com o case exato do manifesto.
      # Arquitetura e escopo vao FIXADOS no proprio --urls ("url|arquitetura|escopo"):
      # o stub do Inno e um exe de 32 bits, entao o wingetcreate detecta x86 e nao
      # consegue casar com o unico no do manifesto (Architecture: x64, Scope: user),
      # falhando com "multiple matches found". O matching usa arquitetura, tipo E escopo,
      # entao os dois precisam ser explicitos.
      # So roda se o token estiver configurado, entao nao quebra releases sem ele.
      # continue-on-error: a submissao depende do winget-pkgs (rate limit, PAT expirado,
      # mudanca de schema); se falhar, os binarios ja estao publicados e o manifesto
      # pode ser enviado a mao - nao e motivo para marcar a release inteira como quebrada.
      - name: Atualizar winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        if: ${{ env.WINGET_TOKEN != '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          # the pr goes out from our fork of winget-pkgs, and wingetcreate gives up when
          # that fork is far behind microsoft/winget-pkgs ("could not be synced"), which
          # is what broke 1.6.0. sync it first; a missing fork is fine, wingetcreate makes one
          $env:GH_TOKEN = $env:WINGET_TOKEN
          $fork = "${{ github.repository_owner }}/winget-pkgs"
          gh repo view $fork --json name *> $null
          if ($LASTEXITCODE -eq 0) {
            gh repo sync $fork --source microsoft/winget-pkgs --force
            if ($LASTEXITCODE -ne 0) { throw "nao consegui sincronizar $fork com o microsoft/winget-pkgs" }
          }

          # token by env var, not --token, so it never shows up in the log
          $env:WINGET_CREATE_GITHUB_TOKEN = $env:WINGET_TOKEN
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Klip-Setup-${{ steps.version.outputs.version }}.exe"
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe update PoBruno.Klip `
            --version ${{ steps.version.outputs.version }} `
            --urls "$installerUrl|x64|user" `
            --submit
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate falhou (codigo $LASTEXITCODE)" }
