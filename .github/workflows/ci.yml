name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK fixo: o mesmo que o tools/check-release.ps1 exige na maquina local
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.403"

      # mesmo script que roda antes de cada tag: versao, actionlint, build e testes
      - name: Checar build e testes
        shell: pwsh
        run: ./tools/check-release.ps1 -SkipInstaller -SkipGitHub
